# Proje      : SEXSOGATE
# Geliştirici: PTYS Technoligess LLC
# Tasarım    : Hamza ÖZBALKAN
# Dosya      : compose.yaml
# Açıklama   : Yalnız yerel web, PostgreSQL, worker ve zamanlayıcı bileşimi.
name: sexsogate-local
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: sexsogate
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set a generated local database password}
      POSTGRES_DB: sexsogate_dev
    volumes: [postgres_data:/var/lib/postgresql]
    ports: ["127.0.0.1:55433:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sexsogate -d sexsogate_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: {context: ., target: web}
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://sexsogate:${LOCAL_DB_PASSWORD}@postgres:5432/sexsogate_dev
      APP_ENV: development
      LIVE_SALES_ENABLED: "false"
    ports: ["127.0.0.1:3000:3000"]
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped
  worker:
    build: {context: ., target: worker}
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://sexsogate:${LOCAL_DB_PASSWORD}@postgres:5432/sexsogate_dev
      APP_ENV: development
      LIVE_SALES_ENABLED: "false"
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped
  scheduler:
    build: {context: ., target: worker}
    command: [node, --import, tsx, scripts/scheduler.ts]
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://sexsogate:${LOCAL_DB_PASSWORD}@postgres:5432/sexsogate_dev
      APP_ENV: development
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped
volumes:
  postgres_data:
